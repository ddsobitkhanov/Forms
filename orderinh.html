<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Food Ordering Form</title>
</head>

<body>
    <h2>Campus Cafeteria Food Ordering Form</h2>
    <form>
        <label>Customer Name:</label><br>
        <input type="text">
        <br>
        <label>Phone Number:</label><br>
        <input type="tel">
        <br>
        <label>Food Choice:</label><br>
        <select>
            <option>--Select Food Choice--</option>
            <option>Fried Rice</option>
            <option>Chicken Rice</option>
            <option>Burger</option>
            <option>Noodles</option>
        </select>
        <br>

        <label>Quantity (1 - 10):</label><br>
        <input type="number" min="1" max="10">

        <br>

        <label>Collection Time:</label><br>
        <input>
        <br>
        <label>Special Instructions / Food Preferences:</label><br>
        <textarea rows="4" cols="30"></textarea>
        <br>
            <button type="submit">Place Order</button>
            <button type="reset">Clear Order</button>
    </form>
</body>

</html>
