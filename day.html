<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tech Innovation Day Registration</title>
</head>

<body>
    <h2>Tech Innovation Day Registration Form</h2>
    <form>

        <label>Full Name:</label><br>
        <input type="text">

        <br>

        <label>Student Email:</label><br>
        <input type="email">

        <br>

        <label>Participation Category:</label><br>
        <input type="radio">
        <label>Participant</label><br>
        <input type="radio">
        <label>Volunteer</label><br>
        <input type="radio">
        <label>Committee Member</label>

        <br>

        <label>Preferred Activities:</label><br>
        <input type="checkbox">
        <label for="webDev">Web Development</label><br>
        <input type="checkbox">
        <label>Artificial Intelligence</label><br>
        <input type="checkbox">
        <label>Cybersecurity</label>

        <br>
        <label>Programme:</label><br>
        <select>
            <option>--Select Programme--</option>
            <option>Foundation in Computing</option>
            <option>Foundation in Arts</option>
        </select>
        <br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>
</body>

</html>
