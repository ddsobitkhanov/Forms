<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Course Feedback Form</title>
</head>

<body>
    <h2>Student Course Feedback Form</h2>
    <form>
        <label>Student Name:</label><br>
        <input type="text">
        <br>
        <label>Course Name:</label><br>
        <select>
            <option>--Select Course--</option>
            <option>Web Programming</option>
            <option>Basic ICT</option>
            <option>Programming</option>
            <option>Database</option>
        </select>
        <br>
        <label>Teaching Satisfaction:</label><br>
        <input type="radio">
        <label>Excellent</label><br>
        <input type="radio">
        <label>Good</label><br>
        <input type="radio">
        <label>Fair</label><br>
        <input type="radio">
        <label>Poor</label>
        <br>
        <label>Preferred Learning Materials:</label><br>
        <input type="checkbox">
        <label>Lecture Slides</label><br>
        <input type="checkbox">
        <label>Videos</label><br>
        <input type="checkbox">
        <label>Exercises</label><br>
        <input type="checkbox">
        <label>Quizzes</label>
        <br>
        <label>Satisfaction Rating (1 to 5):</label><br>
        <input type="range" min="1" max="5">
        <br>
        <label>Additional Comments:</label><br>
        <textarea rows="4" cols="30"></textarea>

        <br>

        <button type="submit">Submit Feedback</button>
        <button type="reset">Clear Feedback</button>

    </form>
</body>

</html>
